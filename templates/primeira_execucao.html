<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Notícias - Carregando</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .spinner {
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        p {
            font-size: 1.2em;
            margin: 15px 0;
            opacity: 0.9;
        }
        
        .info {
            margin-top: 40px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
    <script>
        // Recarrega a página a cada 10 segundos
        setTimeout(() => location.reload(), 10000);
    </script>
</head>
<body>
    <div class="container">
        <h1>📰 Monitor de Notícias</h1>
        <div class="spinner"></div>
        <p>Coletando notícias pela primeira vez...</p>
        <p>Aguarde cerca de 1-2 minutos</p>
        <div class="info">
            A página será recarregada automaticamente quando estiver pronta
        </div>
    </div>
</body>
</html>
